# The hub of a home cluster (docs/cluster.md): what the nodes reach. Docker
# publishes it on this machine alone (127.0.0.1), an address that exists at
# every boot, and Tailscale serves those ports to the tailnet, and only to it
# (`tailscale serve`, which `python scripts/admin.py nodes hub` sets up and
# every start of the hub checks). Without Tailscale, as for a test,
# HUB_BIND_ADDRESS in .env publishes them on a LAN address instead. Docker
# Compose adds this file to docker-compose.yml when .env lists both in
# COMPOSE_FILE, which `nodes hub` writes.
#
# PostgreSQL stays unpublished: nodes never reach the billing database.
#
# With JOB_STORAGE=local, the hub keeps job files in its own bucket, the
# storage service below, which its services reach inside Docker and the
# nodes over the tailnet.

x-hub-wiring: &hub-wiring
  CLUSTER_STORAGE_ENDPOINT: http://storage:8333

x-logging: &logging
  driver: json-file
  options:
    max-size: 20m
    max-file: "5"

services:
  api:
    environment: *hub-wiring
    depends_on:
      storage:
        condition: service_started
  worker:
    environment: *hub-wiring
  remote-worker:
    environment: *hub-wiring

  # The nodes sign in as node-<name>, each with its own password and rules
  # (redis/node.acl); the default user is refused.
  redis:
    ports:
      - "${HUB_BIND_ADDRESS:-127.0.0.1}:6379:6379"

  # The hub's bucket for job files, with JOB_STORAGE=local. The hub and
  # each node have keys of their own, in secrets/storage/s3.json, which
  # `nodes hub`, `nodes invite`, and `nodes revoke` write.
  storage:
    image: chrislusf/seaweedfs:4.50
    command: [server, -dir=/data, -s3, -s3.port=8333, -s3.config=/etc/seaweedfs/s3.json, -volume.max=0]
    ports:
      - "${HUB_BIND_ADDRESS:-127.0.0.1}:8333:8333"
    volumes:
      - storage_data:/data
      - ./secrets/storage/s3.json:/etc/seaweedfs/s3.json:ro
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging: *logging

  # Optional: the images nodes pull instead of building their own
  # (COMPOSE_PROFILES=registry). Only on this machine: `tailscale serve`
  # gives it to the tailnet over HTTPS, with Tailscale's certificate, so no
  # device needs an insecure-registry setting. Nodes pull by digest, so an
  # image pushed by anyone else is never run.
  registry:
    image: registry:2.8.3
    profiles: [registry]
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - registry_data:/var/lib/registry
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging: *logging

volumes:
  storage_data:
  registry_data:
