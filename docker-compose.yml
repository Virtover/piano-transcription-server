# Container wiring (fixed paths and service addresses) is set here.
# Operator choices (limits, worker tuning, billing) go in .env.
x-wiring: &wiring
  REDIS_URL: redis://redis:6379/0
  DATA_DIR: /data
  BILLING_DATABASE_PATH: /billing/billing.sqlite3
  BILLING_BACKUP_DIR: /billing/backups

services:

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment: *wiring
    volumes:
      - data:/data
      - ./billing-data:/billing
      - ./secrets:/run/secrets:ro
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file:
      - .env
    environment: *wiring
    volumes:
      - data:/data
      - ./billing-data:/billing
      - ./secrets:/run/secrets:ro
    depends_on:
      redis:
        condition: service_healthy
    gpus: all
    restart: unless-stopped

  # Only deletes expired job files, so it runs on the small API image.
  cleanup:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file:
      - .env
    environment: *wiring
    volumes:
      - data:/data
    depends_on:
      redis:
        condition: service_healthy
    command: ["python", "-m", "app.worker.cleanup"]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  data:
  redis_data:
