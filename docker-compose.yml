# Container wiring (fixed paths and service addresses) is set here.
# Operator choices (limits, worker tuning, billing) go in .env.
x-wiring: &wiring
  # Each service signs in to Redis as the user `app`; see redis/users.acl.
  REDIS_URL: redis://app@redis:6379/0
  REDIS_PASSWORD_FILE: /run/redis/password
  DATA_DIR: /data
  BILLING_DATABASE_URL: postgresql://billing@postgres:5432/billing
  BILLING_BACKUP_DIR: /billing/backups

# Docker keeps container logs without limit by default, so a busy or failing
# service could fill the disk. This keeps about 100 MB per container.
x-logging: &logging
  driver: json-file
  options:
    max-size: 20m
    max-file: "5"

# The services run as user ID 10001 and need no Linux capability. Without
# any, and unable to gain privileges through a setuid program, a process
# taken over through a media file or a video site (ffmpeg, yt-dlp, deno)
# cannot become root in its container.
x-unprivileged: &unprivileged
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true

services:

  # Gives /data and billing-data to the services' non-root user, then exits.
  # Docker creates a missing bind-mounted folder as root, so a new server
  # needs this as much as an old one. It runs as root without a network and
  # never touches the PostgreSQL cluster. See app/prepare.py.
  prepare:
    build:
      context: .
      dockerfile: Dockerfile.api
    user: root
    network_mode: none
    environment:
      # The host group that may manage billing-data; scripts/server.py sets it.
      BILLING_DATA_GROUP: ${BILLING_DATA_GROUP:-}
    volumes:
      - data:/data
      - ./billing-data:/billing
    command: ["python", "-m", "app.prepare"]
    # Root only to change owners and modes: of root's powers it keeps those
    # alone. FSETID keeps the setgid bit on folders of another group.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, FSETID]
    security_opt:
      - no-new-privileges:true
    restart: "no"
    logging: *logging

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      # 0.0.0.0 accepts connections on every network interface. Set
      # API_BIND_ADDRESS=127.0.0.1 in .env when an HTTPS proxy on this machine
      # forwards to the API, so only the proxy can reach it.
      - "${API_BIND_ADDRESS:-127.0.0.1}:8000:8000"
    env_file:
      - .env
    environment: *wiring
    volumes:
      - data:/data
      # Backups, restores, and the one-time SQLite migration. Only the API
      # gets this folder: the workers process untrusted media and reach
      # billing through PostgreSQL alone.
      - ./billing-data:/billing
      - ./secrets:/run/secrets:ro
      # Only this service's Redis password. The other Redis users' passwords,
      # also in secrets/redis, are hidden under an empty folder.
      - ./secrets/redis/app:/run/redis/password:ro
      - type: tmpfs
        target: /run/secrets/redis
    depends_on:
      prepare:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    <<: *unprivileged
    restart: unless-stopped
    logging: *logging

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
      args:
        # legacy builds for older GPUs such as the GTX 10 series; see
        # WORKER_GPU_BUILD in docs/configuration.md.
        GPU_BUILD: ${WORKER_GPU_BUILD:-current}
    env_file:
      - .env
    environment: *wiring
    volumes:
      - data:/data
      - ./secrets:/run/secrets:ro
      # Only this service's Redis password. The other Redis users' passwords,
      # also in secrets/redis, are hidden under an empty folder.
      - ./secrets/redis/app:/run/redis/password:ro
      - type: tmpfs
        target: /run/secrets/redis
      # The tunnel token, with which anyone could receive the API's traffic,
      # is hidden too: this service downloads and decodes untrusted media.
      # scripts/server.py creates the folder, which must exist to be hidden.
      - type: tmpfs
        target: /run/secrets/cloudflare
    depends_on:
      prepare:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    gpus: all
    <<: *unprivileged
    restart: unless-stopped
    logging: *logging

  # Sends jobs to the outsourcing provider when local GPUs are overloaded.
  # Always started: with OUTSOURCE_PROVIDER=none it only idles, so .env is the
  # one switch. It downloads and converts audio here and needs no GPU, so it
  # runs on the API image. See docs/runpod.md.
  remote-worker:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file:
      - .env
    environment: *wiring
    volumes:
      - data:/data
      - ./secrets:/run/secrets:ro
      # Only this service's Redis password. The other Redis users' passwords,
      # also in secrets/redis, are hidden under an empty folder.
      - ./secrets/redis/app:/run/redis/password:ro
      - type: tmpfs
        target: /run/secrets/redis
      # The tunnel token is hidden too, as from the worker.
      - type: tmpfs
        target: /run/secrets/cloudflare
    depends_on:
      prepare:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: ["python", "-m", "app.worker.launcher", "remote"]
    <<: *unprivileged
    restart: unless-stopped
    logging: *logging

  # Only deletes expired job files, so it runs on the small API image.
  cleanup:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file:
      - .env
    environment: *wiring
    volumes:
      - data:/data
      # Its Redis password, and no other secret.
      - ./secrets/redis/app:/run/redis/password:ro
    depends_on:
      prepare:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: ["python", "-m", "app.worker.cleanup"]
    <<: *unprivileged
    # It writes only to /data.
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    logging: *logging

  # Optional admin web page; see docs/administration.md. Started only with
  # admin in COMPOSE_PROFILES, and it exits at once with ADMIN_WEB_MODE=disabled.
  # cloudflared sends it its own hostname, behind Cloudflare Access; no port
  # is published. It signs in to Redis and PostgreSQL as admin-<mode>, with
  # only what that mode needs, gets no other secret, and cannot write files.
  admin:
    build:
      context: .
      dockerfile: Dockerfile.api
    profiles: [admin]
    env_file:
      - .env
    environment:
      <<: *wiring
      REDIS_URL: redis://admin-${ADMIN_WEB_MODE:-disabled}@redis:6379/0
      BILLING_DATABASE_URL: postgresql://admin-${ADMIN_WEB_MODE:-disabled}@postgres:5432/billing
    volumes:
      - data:/data:ro
      - ./billing-data/backups:/billing/backups:ro
      - ./secrets/redis/admin-${ADMIN_WEB_MODE:-disabled}:/run/redis/password:ro
      - ./secrets/admin-web/postgres-${ADMIN_WEB_MODE:-disabled}:/run/secrets/postgres_password:ro
    command: ["python", "-m", "app.admin_web"]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    depends_on:
      # The API creates the tables and the admin roles.
      api:
        condition: service_started
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: on-failure
    logging: *logging

  # Optional HTTPS access through a Cloudflare Tunnel. Started only with
  # COMPOSE_PROFILES=cloudflare in .env. It connects out to Cloudflare and
  # forwards to the API on this network, so no port is opened. Besides it,
  # only the API sees the token, for `python -m app.config check`; the
  # workers' copy of secrets/ hides it. See docs/cloudflare-tunnel.md.
  cloudflared:
    image: cloudflare/cloudflared:2026.10.0
    profiles: [cloudflare]
    command:
      - tunnel
      # Readiness for `check --online`, on this network only.
      - --metrics
      - 0.0.0.0:20241
      - run
      - --token-file
      - /run/secrets/cloudflare/tunnel_token
    volumes:
      - ./secrets/cloudflare:/run/secrets/cloudflare:ro
    depends_on:
      - api
    # The image runs as a non-root user that needs no capability.
    <<: *unprivileged
    restart: unless-stopped
    logging: *logging

  # Redis holds job state and the queues. The append-only file is synced
  # every second, so a power cut loses at most about a second of changes;
  # snapshots alone could lose an hour. scripts/server.py turns it on in a
  # running Redis before restarting, because starting with it on over a
  # snapshot-only volume starts empty. See docs/architecture.md.
  #
  # Every client signs in as a user with its own password, from
  # secrets/redis; connecting without one is refused. redis/start.sh gives
  # Redis the users in redis/users.acl before starting it. Only this service
  # sees all the passwords. See "Redis users" in docs/architecture.md.
  redis:
    image: redis:7-alpine
    entrypoint: ["/bin/sh", "/redis/start.sh"]
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(cat /run/secrets/redis/operator)\" redis-cli --user operator ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis_data:/data
      - ./redis:/redis:ro
      - ./secrets/redis:/run/secrets/redis:ro
    # Its entrypoint starts as root and switches to the redis user; nothing
    # may gain privileges after that.
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging: *logging

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: billing
      POSTGRES_USER: billing
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billing -d billing"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      # The live database: the billing-data folder by default, or the Docker
      # volume postgres_data with POSTGRES_DATA_LOCATION=postgres_data. Changing
      # it does not move the data; see "Moving the billing database" in
      # docs/configuration.md.
      - ${POSTGRES_DATA_LOCATION:-./billing-data/postgres}:/var/lib/postgresql/data
    # As for Redis: root only until it switches to the postgres user.
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging: *logging

volumes:
  data:
  redis_data:
  postgres_data:

secrets:
  postgres_password:
    file: ./secrets/postgres_password
