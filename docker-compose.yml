# Container wiring (fixed paths and service addresses) is set here.
# Operator choices (limits, worker tuning, billing) go in .env.
x-wiring: &wiring
  REDIS_URL: redis://redis:6379/0
  DATA_DIR: /data
  BILLING_DATABASE_URL: postgresql://billing@postgres:5432/billing
  BILLING_BACKUP_DIR: /billing/backups

# Docker keeps container logs without limit by default, so a busy or failing
# service could fill the disk. This keeps about 100 MB per container.
x-logging: &logging
  driver: json-file
  options:
    max-size: 20m
    max-file: "5"

services:

  # Gives /data and billing-data to the services' non-root user, then exits.
  # Docker creates a missing bind-mounted folder as root, so a new server
  # needs this as much as an old one. It runs as root without a network and
  # never touches the PostgreSQL cluster. See app/prepare.py.
  prepare:
    build:
      context: .
      dockerfile: Dockerfile.api
    user: root
    network_mode: none
    environment:
      # The host group that may manage billing-data; scripts/server.py sets it.
      BILLING_DATA_GROUP: ${BILLING_DATA_GROUP:-}
    volumes:
      - data:/data
      - ./billing-data:/billing
    command: ["python", "-m", "app.prepare"]
    restart: "no"
    logging: *logging

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      # 0.0.0.0 accepts connections on every network interface. Set
      # API_BIND_ADDRESS=127.0.0.1 in .env when an HTTPS proxy on this machine
      # forwards to the API, so only the proxy can reach it.
      - "${API_BIND_ADDRESS:-127.0.0.1}:8000:8000"
    env_file:
      - .env
    environment: *wiring
    volumes:
      - data:/data
      # Backups, restores, and the one-time SQLite migration. Only the API
      # gets this folder: the workers process untrusted media and reach
      # billing through PostgreSQL alone.
      - ./billing-data:/billing
      - ./secrets:/run/secrets:ro
    depends_on:
      prepare:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
      args:
        # legacy builds for older GPUs such as the GTX 10 series; see
        # WORKER_GPU_BUILD in docs/configuration.md.
        GPU_BUILD: ${WORKER_GPU_BUILD:-current}
    env_file:
      - .env
    environment: *wiring
    volumes:
      - data:/data
      - ./secrets:/run/secrets:ro
    depends_on:
      prepare:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    gpus: all
    restart: unless-stopped
    logging: *logging

  # Sends jobs to the outsourcing provider when local GPUs are overloaded.
  # Always started: with OUTSOURCE_PROVIDER=none it only idles, so .env is the
  # one switch. It downloads and converts audio here and needs no GPU, so it
  # runs on the API image. See docs/runpod.md.
  remote-worker:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file:
      - .env
    environment: *wiring
    volumes:
      - data:/data
      - ./secrets:/run/secrets:ro
    depends_on:
      prepare:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: ["python", "-m", "app.worker.launcher", "remote"]
    restart: unless-stopped
    logging: *logging

  # Only deletes expired job files, so it runs on the small API image.
  cleanup:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file:
      - .env
    environment: *wiring
    volumes:
      - data:/data
    depends_on:
      prepare:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: ["python", "-m", "app.worker.cleanup"]
    restart: unless-stopped
    logging: *logging

  # Optional HTTPS access through a Cloudflare Tunnel. Started only with
  # COMPOSE_PROFILES=cloudflare in .env. It connects out to Cloudflare and
  # forwards to the API on this network, so no port is opened. Only it gets
  # the token's folder. See docs/cloudflare-tunnel.md.
  cloudflared:
    image: cloudflare/cloudflared:2026.10.0
    profiles: [cloudflare]
    command:
      - tunnel
      # Readiness for `check --online`, on this network only.
      - --metrics
      - 0.0.0.0:20241
      - run
      - --token-file
      - /run/secrets/cloudflare/tunnel_token
    volumes:
      - ./secrets/cloudflare:/run/secrets/cloudflare:ro
    depends_on:
      - api
    restart: unless-stopped
    logging: *logging

  # Redis holds job state and the queues. The append-only file is synced
  # every second, so a power cut loses at most about a second of changes;
  # snapshots alone could lose an hour. scripts/server.py turns it on in a
  # running Redis before restarting, because starting with it on over a
  # snapshot-only volume starts empty. See docs/architecture.md.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis_data:/data
    restart: unless-stopped
    logging: *logging

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: billing
      POSTGRES_USER: billing
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billing -d billing"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      # The live database: the billing-data folder by default, or the Docker
      # volume postgres_data with POSTGRES_DATA_LOCATION=postgres_data. Changing
      # it does not move the data; see "Moving the billing database" in
      # docs/configuration.md.
      - ${POSTGRES_DATA_LOCATION:-./billing-data/postgres}:/var/lib/postgresql/data
    restart: unless-stopped
    logging: *logging

volumes:
  data:
  redis_data:
  postgres_data:

secrets:
  postgres_password:
    file: ./secrets/postgres_password
