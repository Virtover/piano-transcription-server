services:

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - data:${DATA_DIR}
      - ./billing-data:/billing
      - ./secrets:/run/secrets:ro
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file:
      - .env
    volumes:
      - data:${DATA_DIR}
      - ./billing-data:/billing
      - ./secrets:/run/secrets:ro
    depends_on:
      redis:
        condition: service_healthy
    gpus: all
    restart: unless-stopped

  cleanup:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file:
      - .env
    volumes:
      - data:${DATA_DIR}
    depends_on:
      redis:
        condition: service_healthy
    command: ["python3", "-m", "app.worker.cleanup"]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  data:
  redis_data: