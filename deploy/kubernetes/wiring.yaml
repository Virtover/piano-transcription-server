# Container wiring, as x-wiring in docker-compose.yml. Every pod lists this
# after the settings, so these values win, as Compose's environment wins over
# .env. The Redis and database addresses are settings here: REDIS_URL in
# settings.env, the database URL in the secret database_url.
apiVersion: v1
kind: ConfigMap
metadata:
  name: wiring
data:
  DEPLOYMENT: kubernetes
  REDIS_PASSWORD_FILE: /run/redis/password
  DATA_DIR: /data
  # Several machines share no data volume, and no folder outlives a pod.
  JOB_STORAGE: s3
  DATABASE_BACKUPS: provider
