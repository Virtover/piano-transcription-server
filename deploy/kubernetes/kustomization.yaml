# The server on a real Kubernetes cluster, for several machines: API
# replicas behind one Service, GPU workers that KEDA adds as the queue grows,
# and Redis and PostgreSQL as managed services. See docs/kubernetes.md.
#
#   python scripts/kube.py up       # or: kubectl apply -k deploy/kubernetes
#
# scripts/kube.py writes settings.env and the Secrets, and sets the images;
# by hand, see docs/kubernetes.md. A test cluster on this PC is ./local.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Also in the metrics URL of base/worker.yaml, which KEDA reads from its own
# namespace; change both together.
namespace: piano-transcription

resources:
  - namespace.yaml
  - base

# The admin web page; uncomment to deploy it. See docs/kubernetes.md.
# components:
#   - components/admin-web

# The server's settings: a copy of server.env, which holds nothing of Docker
# Compose's, with REDIS_URL added. Not committed. A change rolls the pods out.
configMapGenerator:
  - name: settings
    envs:
      - settings.env

# Built from Dockerfile.api and Dockerfile.worker, and pushed to a registry
# the cluster can pull from.
images:
  - name: piano-api
    newName: registry.example.com/piano-transcription-api
    newTag: "1"
  - name: piano-worker
    newName: registry.example.com/piano-transcription-worker
    newTag: "1"
