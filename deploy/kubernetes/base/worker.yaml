# GPU workers, as worker in docker-compose.yml, one GPU each. KEDA adds and
# removes them on the queue that /metrics reports; see "Metrics for scaling"
# in docs/architecture.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      # No pod uses the Kubernetes API: a compromised one gets no token for it.
      automountServiceAccountToken: false
      # A stopping worker finishes the jobs it runs; Dramatiq takes no new
      # ones after SIGTERM. A job still running at the end fails and is
      # refunded.
      terminationGracePeriodSeconds: 900
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # The GPU nodes' label and taint come from cluster.env, through the
      # component scripts/kube.py writes; see docs/kubernetes.md.
      # Workers on different machines where they can be, so that one machine
      # going away takes as few as possible.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app: worker
      containers:
        - name: worker
          image: piano-worker
          envFrom:
            - configMapRef:
                name: settings
            - configMapRef:
                name: wiring
          resources:
            requests:
              cpu: "2"
              memory: 8Gi
            limits:
              nvidia.com/gpu: 1
              memory: 16Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            # Each attempt's scratch folder; the bucket keeps the job files.
            - name: data
              mountPath: /data
            # piano-secrets holds no tunnel token or Redis passwords other
            # than this one: workers decode untrusted media.
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
            - name: redis
              mountPath: /run/redis/password
              subPath: app
              readOnly: true
      volumes:
        - name: data
          emptyDir: {}
        - name: secrets
          secret:
            secretName: piano-secrets
        - name: redis
          secret:
            secretName: piano-redis
---
# The scraper's credential: the secret metrics_token, sent as a Bearer token.
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: metrics
spec:
  secretTargetRef:
    - parameter: token
      name: piano-secrets
      key: metrics_token
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: worker
spec:
  scaleTargetRef:
    name: worker
  minReplicaCount: 1
  maxReplicaCount: 4
  pollingInterval: 15
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        # Removing a worker waits for its jobs, and starting one loads the
        # model for about a minute: remove them one at a time, slowly.
        scaleDown:
          stabilizationWindowSeconds: 600
          policies:
            - type: Pods
              value: 1
              periodSeconds: 300
  # minReplicaCount, maxReplicaCount, and the second trigger's targetValue
  # come from cluster.env.
  triggers:
    # The workers the jobs waiting or running need, which the API works out
    # from the jobs each live worker runs at once: workers on larger GPUs
    # take more, so a cluster of mixed GPUs needs no setting here.
    - type: metrics-api
      metricType: AverageValue
      metadata:
        url: http://api.piano-transcription.svc.cluster.local:8000/metrics
        format: prometheus
        valueLocation: 'piano_local_workers_needed{queue="default",backend="local"}'
        targetValue: "1"
        authMode: bearer
      authenticationRef:
        name: metrics
    # One worker more while the oldest job waits longer than a minute.
    - type: metrics-api
      metricType: Value
      metadata:
        url: http://api.piano-transcription.svc.cluster.local:8000/metrics
        format: prometheus
        valueLocation: 'piano_queue_oldest_job_age_seconds{queue="default",backend="local"}'
        targetValue: "60"
        authMode: bearer
      authenticationRef:
        name: metrics
