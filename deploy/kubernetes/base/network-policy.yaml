# Which pod may talk to which. They work only where the cluster's network
# plugin enforces NetworkPolicies, as Calico and Cilium do; elsewhere they
# change nothing. See "Network rules" in docs/kubernetes.md.
#
# Nothing reaches a pod unless a rule below lets it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
# The API answers the tunnel, and KEDA, which reads /metrics for the scaling.
# KEDA's namespace comes from cluster.env.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api
spec:
  podSelector:
    matchLabels:
      app: api
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: cloudflared
      ports:
        - port: 8000
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: keda
      ports:
        - port: 8000
          protocol: TCP
---
# The pods that fetch video links or decode untrusted media reach the
# internet and this namespace, but not the node's link-local addresses, where
# clouds answer with the machine's credentials. app/url_safety.py refuses
# them too; this holds should a decoder be taken over.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: no-metadata
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [api, worker, remote-worker]
  policyTypes: [Egress]
  egress:
    # Names, from any address: a node-local DNS cache listens on a
    # link-local one.
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # The test cluster's own services, and anything in this namespace; the
    # rules above decide what answers.
    - to:
        - podSelector: {}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except: [169.254.0.0/16]
        - ipBlock:
            cidr: ::/0
            except: [fe80::/10, fd00:ec2::254/128]
