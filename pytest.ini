[pytest]
# Short tracebacks: a failure shows the failing lines, not every frame's source.
addopts = --tb=short
# Known deprecations that need no action from a test run. Remove the on_event
# filter when app/main.py moves to lifespan handlers.
filterwarnings =
    ignore:Using `httpx` with `starlette.testclient` is deprecated
    ignore:\s*on_event is deprecated
