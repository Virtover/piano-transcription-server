# Runs the test suite on every push to main and every pull request. The tests
# need no Docker, GPU, or credentials; model tests that need PyTorch are
# skipped, as without the worker requirements locally.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the older run.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      # Enables the media tests that probe and convert real files.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install dependencies
        run: python -m pip install -r requirements.test.txt

      - name: Run tests
        run: python -m pytest -q
